name: Note retrieval live smoke test

on:
  push:
    branches: [floating-annotation-editor]
    paths: [.github/workflows/note-retrieval-e2e.yml]

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    environment: note-retrieval-e2e
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Sync real annotations and verify tagging and readback
        env:
          HYPOTHESIS_API_TOKEN: ${{ secrets.HYPOTHESIS_API_TOKEN }}
          NOTE_TAG_API_KEY: ${{ secrets.NOTE_TAG_API_KEY }}
          NOTE_TAG_API_URL: ${{ vars.NOTE_TAG_API_URL }}
          NOTE_TAG_MODEL: ${{ vars.NOTE_TAG_MODEL }}
          HYPOTHESIS_E2E_URI: ${{ vars.HYPOTHESIS_E2E_URI }}
          NOTE_TAG_OUTPUT_TOKEN_FIELD: ${{ vars.NOTE_TAG_OUTPUT_TOKEN_FIELD || 'max_tokens' }}
        run: python3 note-retrieval/hypothesis_e2e.py --output-token-field "$NOTE_TAG_OUTPUT_TOKEN_FIELD"
